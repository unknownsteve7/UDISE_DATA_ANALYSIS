      - name: district_name
        description: "Name of the district"
        tests:
          - not_null
      - name: school_name
        description: "Name of the school"
        tests:
          - not_null
      - name: total_enrol_class8
        description: "Total number of students enrolled in class 8"
        tests:
          - not_null
      - name: total_enrol_class9
        description: "Total number of students enrolled in class 9"
        tests:
          - not_null
      - name: total_teachers_all_classes
        description: "Total number of teachers in the school"
        tests:
          - not_null
      - name: girls_retention_rate_class8_9
        description: "Retention rate of girls from class 8 to class 9"
        tests:
          - not_null
      - name: ptr_class8_9
        description: "Pupil-Teacher Ratio for class 8 to class 9"
        tests:
          - not_null
      - name: staffing_status
        description: "Staffing status based on PTR"
        tests:
          - not_null
          - accepted_values:
            values: ["Under-staffed", "Well-staffed", "Over-staffed"]
