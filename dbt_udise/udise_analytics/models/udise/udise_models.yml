version: 2

models:

    
  - name: girls_retention_vs_infra
    description: "Analyzes Class 8 to Class 9 girls transition/retention rates grouped by school infrastructure availability (functional girls toilets and functional electricity)."
    columns:
      - name: state_name
        description: "Name of the state"
        tests:
          - not_null
          - accepted_values:
            values: ["Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal", "Andaman and Nicobar Islands", "Chandigarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Jammu and Kashmir", "Ladakh", "Lakshadweep", "Puducherry"]
      - name: district_name
        description: "Name of the district"
        tests:
          - not_null
          
      - name: school_name
        description: "Name of the school"
        tests:
          - not_null
      - name: girls_enrol_class8
        description: "Number of girls enrolled in class 8"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
            min_value: 0
            max_value: 1000000
      - name: girls_enrol_class9
        description: "Number of girls enrolled in class 9"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
            min_value: 0
            max_value: 1000000
      - name: total_enrol_class8
        description: "Total number of students enrolled in class 8"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
            min_value: 0
            max_value: 1000000
      - name: total_enrol_class9
        description: "Total number of students enrolled in class 9"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
            min_value: 0
            max_value: 1000000
      - name: girls_retention_rate_class8_9
        description: "Retention rate of girls from class 8 to class 9"
        tests:
          - not_null
      - name: girls_toilet_available
        description: "Whether girls toilet is available (1 if available, 0 if not)"
        tests:
          - not_null
          - accepted_values:
            values: [0, 1]
      - name: electricity_available
        description: "Whether electricity is available (1 if available, 0 if not)"
        tests:
          - not_null
          - accepted_values:
            values: [0, 1]
      - name: infra_score
        description: "Infrastructure score based on availability of girls toilet and electricity"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
            min_value: 0
            max_value: 7
        

  - name: ptr_and_teacher_allocation
    description: "Computes the Pupil-Teacher Ratio (PTR) for schools and flags their staffing status (e.g., Under-staffed, Well-staffed) based on national RTE guidelines."
    columns:
      - name: state_name
        description: "Name of the state"
        tests:
